[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["guests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/e6qu/fun-with-emulators"
rust-version = "1.95"

[workspace.dependencies]
fwe-abi = { path = "crates/abi" }
fwe-elf = { path = "crates/elf" }
fwe-kernel = { path = "crates/kernel" }
fwe-native = { path = "crates/native" }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1

# LTP's runs (CI's `ltp` job): optimized, as a user's fwe is, with the
# debug build's assertions and overflow checks, which odd arguments find.
# Some tests take as long as the host's own calls make them: fork14 forks
# 16384 times with up to 16 TiB reserved, which costs macOS's fork about
# as long under an optimized fwe as natively (50-60 ms a fork near the
# end), and a third longer under the debug build.
[profile.checked]
inherits = "release"
debug-assertions = true
overflow-checks = true
lto = "off"
codegen-units = 16

# Preparing guest code scans every word of a program's executable sections,
# 100 MB and more for rustc's libraries, once per process: optimized even in
# debug builds, so the end-to-end tests are not dominated by it. Debug
# assertions and overflow checks stay on.
[profile.dev.package.fwe-native]
opt-level = 2

[profile.dev.package.fwe-elf]
opt-level = 2
