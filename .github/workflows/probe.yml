name: probe-display
on:
  push:
    branches: [probe-media]
jobs:
  display:
    strategy:
      fail-fast: false
      matrix:
        k: [1, 2, 3, 4]
    name: Display (macos-26)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-files-${{ hashFiles('guests/*/fetch/*.txt') }}
      # The apps of fwe's own the application tests build under fwe.
      - uses: actions/cache@v4
        with:
          path: target/built-apps
          key: built-apps-${{ hashFiles('guests/apps/tauri/**', 'guests/apps/wails/**', 'guests/alpine/fetch/apps.txt') }}
      # Unicorn: the hypervisor stand-in, Wine's VM.
      - run: brew install xorg-server xdotool unicorn molten-vk vulkan-tools pulseaudio
      # The Mac's Vulkan drivers, each one's devices, and whether each has
      # what Zink needs (robustness2's nullDescriptor): a record of the
      # runner, which fails nothing.
      - name: The runner's Vulkan drivers
        run: |
          for icd in "$(brew --prefix)"/etc/vulkan/icd.d/*.json "$(brew --prefix)"/share/vulkan/icd.d/*.json; do
            echo "== $icd"
            VK_DRIVER_FILES="$icd" vulkaninfo 2>&1 \
              | grep -E "deviceName|driverName|apiVersion|nullDescriptor|ERROR|Cannot" | sort -u || true
          done
      - name: The display and sound tests
        run: |
          export XVFB="$(brew --prefix)/bin/Xvfb"
          export LIBX11="$(brew --prefix libx11)/lib/libX11.6.dylib"
          export FWE_VULKAN_DRIVER="$(brew --prefix)/etc/vulkan/icd.d/MoltenVK_icd.json"
          export PULSEAUDIO="$(brew --prefix pulseaudio)/bin/pulseaudio"
          for i in 1 2; do cargo test -p fwe --test guests -- display_ sound_ --nocapture 2>&1 | grep -a -E "^test |test result|panicked|of the tone|xrun|timing: exit: [0-9]* system calls|^---- " | cut -c1-1500; done
        env:
          FWE_DISPLAY_TESTS: "1"
          FWE_SOUND_TESTS: "1"
      # What each program said, its calls and its screenshots.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-${{ matrix.k }}
          path: target/tmp/display

