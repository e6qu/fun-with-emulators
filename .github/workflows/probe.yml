name: probe-pipewire-fwe
on:
  push:
    branches: [probe-media]
jobs:
  sound:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-files-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: brew install pulseaudio
      - name: The PipeWire sound case, ten times, logged
        run: |
          export PULSEAUDIO="$(brew --prefix pulseaudio)/bin/pulseaudio"
          mkdir -p target/tmp/display
          python3 tools/probe-latency.py target/tmp/display/latency.txt & lat=$!
          # The runner's 3 CPUs kept busy, as the Display job's other tests keep them.
          python3 tools/probe-memhog.py 6 & load=$!
          sleep 20; memory_pressure -Q || true; vm_stat | head -8
          for i in $(seq 16); do
            PROBE_RUN=$i cargo test -p fwe --test guests -- --exact sound_clients_play_on_the_macs_pulseaudio_server --nocapture 2>&1 | grep -a -E "PROBE|test result|panicked" | cut -c1-300
            cp target/tmp/display/pulse-clients.err target/tmp/display/run$i-pulse-server.err 2>/dev/null || true
          done
          memory_pressure -Q || true; vm_stat | head -12
          kill "$lat"; for p in $load; do [ "$p" -gt 0 ] && kill "$p"; done
          sysctl hw.ncpu hw.memsize
        env:
          FWE_SOUND_TESTS: "1"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sound
          path: target/tmp/display
