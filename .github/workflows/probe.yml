name: probe-media
on:
  push:
    branches: [probe-media]
jobs:
  media:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-files-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: brew install pulseaudio
      - run: cargo test -p fwe --test guests --no-run
      - name: The sound clients, three times, whole
        env:
          FWE_SOUND_TESTS: "1"
        run: |
          export PULSEAUDIO="$(brew --prefix pulseaudio)/bin/pulseaudio"
          for i in 1 2 3; do
            echo "=== run $i"
            cargo test -q -p fwe --test guests -- --exact sound_clients_play_on_the_macs_pulseaudio_server --nocapture > run-$i.txt 2>&1 || true
            cp target/tmp/display/pulse-clients.err pulse-$i.err || true
            grep -a -E "frames of sound|test result" run-$i.txt | sed -E 's/\["\/bin\/sh".*exit \$r"\]/[pw-play]/' | cut -c1-300
          done
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: media
          path: |
            run-*.txt
            pulse-*.err
