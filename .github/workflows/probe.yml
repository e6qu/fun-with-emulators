name: probe-openttd-sound
on:
  push:
    branches: [probe-media]
jobs:
  linux:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: PipeWire's tunnel natively, 20 runs
        run: |
          mkdir -p out
          docker run --rm -v "$PWD:/work:ro" -v "$PWD/out:/out" debian:trixie sh -c '
            apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pulseaudio pulseaudio-utils alsa-utils libasound2-plugins pipewire pipewire-bin libpipewire-0.3-modules wireplumber python3 > /out/apt.txt 2>&1
            useradd -m pa && python3 /work/tools/probe-pw-native.py'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out
