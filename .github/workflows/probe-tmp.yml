name: probe-tmp
on:
  push:
    branches: [m6-native]
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p fwe
      - run: clang -O2 -Wno-deprecated-declarations -o bench-mac guests/c/bench.c
      - name: Build the Linux bench with zig
        run: |
          brew install zig >/dev/null 2>&1 || true
          zig cc -target aarch64-linux-musl -O2 -fPIE -pie -o bench-linux guests/c/bench.c
      - name: Timings
        run: |
          F=target/release/fwe
          time (for i in $(seq 20); do $F --version >/dev/null; done)
          time (for i in $(seq 20); do ./bench-mac exit; done)
          time (for i in $(seq 20); do $F ./bench-linux exit; done)
          for i in 1 2 3; do FWE_TIMING=1 $F ./bench-linux exit; done
          for i in 1 2; do FWE_TIMING=1 FWE_CLOSETEST=1 $F ./bench-linux exit; done
          FWE_TIMING=1 $F ./bench-linux forkexec 3 ./bench-linux
          $F ./bench-linux forkexec 20 ./bench-linux
          ./bench-mac forkexec 20 ./bench-mac
          echo "TMPDIR=$TMPDIR"; df -h $TMPDIR /tmp | head -5
      - name: First closes
        run: |
          for k in 1 2 3; do for h in write write-qos mmap empty; do target/release/fwe --probe first-close-$h; done; done
      - name: File writes from fwe
        run: |
          target/release/fwe --probe file-writes
          target/release/fwe --probe file-writes
      - name: File writes on this runner
        run: |
          python3 - <<'PY'
          import os, time, tempfile
          d = tempfile.mkdtemp()
          def t(name, f, n=30):
              s = time.perf_counter()
              for i in range(n): f(i)
              print(f"{name}: {(time.perf_counter()-s)/n*1e6:.0f} us")
          t("create empty", lambda i: os.close(os.open(f"{d}/e{i}", os.O_CREAT|os.O_WRONLY, 0o600)))
          def cw(i):
              fd = os.open(f"{d}/w{i}", os.O_CREAT|os.O_WRONLY, 0o600); os.pwrite(fd, b"x"*200, 0); os.close(fd)
          t("create+write+close", cw)
          def rw(i):
              fd = os.open(f"{d}/w{i}", os.O_WRONLY); os.pwrite(fd, b"y"*200, 0); os.close(fd)
          t("rewrite existing", rw)
          fd = os.open(f"{d}/keep", os.O_CREAT|os.O_RDWR, 0o600)
          t("pwrite kept open", lambda i: os.pwrite(fd, b"z"*200, 0))
          import mmap
          os.ftruncate(fd, 4096); m = mmap.mmap(fd, 4096)
          def mm(i): m[0:200] = b"q"*200
          t("mmap store", mm)
          PY
