name: Probe (temporary)
on:
  push:
    branches: [m5-gate]
jobs:
  hang:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: cargo build && cargo test -p fwe --test guests --no-run
      - run: |
          cargo test -p fwe --test guests -- --skip hv_ > t.log 2>&1 &
          T=$!
          sleep 80
          ps -axo pid,ppid,stat,etime,command | grep -E "target/debug/fwe" | grep -v grep | cut -c1-220 | head -60
          for p in $(pgrep -f "usr/bin/node|bin/lighttpd|bin/bash /srv"); do
            echo "=== sample $p: $(ps -o command= -p $p | cut -c1-200)"
            sample $p 1 2>/dev/null | awk '/Call graph/,/Total number/' | sed -E 's/\(in [^)]*\)//; s/\[0x[0-9a-f,]+\]//' | cut -c1-170 | head -90
          done
          for c in $(pgrep -f "target/debug/fwe"); do
            if ps -o command= -p $c | grep -qE "srv/www|count.sh|bash -c"; then
              echo "=== sample child $c: $(ps -o command= -p $c | cut -c1-200)"
              sample $c 1 2>/dev/null | awk '/Call graph/,/Total number/' | sed -E 's/\(in [^)]*\)//; s/\[0x[0-9a-f,]+\]//' | cut -c1-170 | head -60
            fi
          done
          wait $T || true
          grep -E "FAILED|test result" t.log
