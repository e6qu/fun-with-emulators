name: Probe (temporary)
on:
  push:
    branches: [m5-exec]
jobs:
  fork-maps:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: Swatinem/rust-cache@v2
      - run: |
          git worktree add -q wt-main origin/main
          git worktree add -q wt-head HEAD
          git worktree add -q wt-rename HEAD
          (cd wt-rename && git apply ../tools/probe-tmp/rename.patch)
          for c in main head rename; do
            (cd wt-$c && CARGO_TARGET_DIR=$PWD/../tgt cargo build -q -p fwe && cp ../tgt/debug/fwe ../fwe-$c)
          done
      - uses: actions/cache@v4
        with:
          path: target/ltp/root
          key: ltp-root-${{ hashFiles('tools/ltp/build.sh') }}
      - run: test -d target/ltp/root/opt/ltp
      - run: sudo sysctl -w kern.maxfiles=184320 kern.maxfilesperproc=92160
      - run: |
          for c in head main rename; do
            python3 tools/ltp/run.py --fwe $PWD/fwe-$c --root target/ltp/root --jobs 1 \
              --only '^fork14$' --results r.txt > log.txt 2>&1 || true
            echo "== $c: $(grep -E '^\[[0-9]+/' log.txt)"
          done
