name: Probe (temporary)
on:
  push:
    branches: [m5-exec]
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - run: gcc -O2 -static-pie -o bench guests/c/bench.c
      - uses: actions/upload-artifact@v4
        with: { name: probe-bench, path: bench }
  probe:
    needs: build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with: { name: probe-bench }
      - run: cargo build --release -p fwe
      - run: clang -O2 -dynamiclib -o interp.dylib tools/probe-tmp/interp.c
      - run: |
          chmod +x bench
          sysctl -n machdep.cpu.brand_string hw.ncpu; uptime
          python3 - <<'PY'
          import subprocess,time
          for cmd in (["target/release/fwe","--version"],["/usr/bin/true"],["target/release/fwe","./bench","exit"]):
              ts=[]
              for i in range(40):
                  t=time.perf_counter(); subprocess.run(cmd,stdout=subprocess.DEVNULL); ts.append((time.perf_counter()-t)*1e3)
              ts.sort(); print(cmd, "min %.2f med %.2f"%(ts[0],ts[20]))
          PY
          for i in 1 2 3 4 5; do FWE_T=1 target/release/fwe ./bench exit 2>&1 | awk '{printf "%s %.2f | ", $NF, $2-p; p=$2} END{print ""}'; done
          FWE_T=1 target/release/fwe ./bench forkexec 4 $PWD/bench 2>&1 | grep -E "f |exec|x |exit" | sed -E 's/\[t\] +//' | awk '{printf "%.2f %s %s\n", $1-p, $3, $4; p=$1}'
          FWE_T=1 target/release/fwe ./bench fork 4 2>&1 | grep -E "f |exit" | sed -E 's/\[t\] +//' | awk '{printf "%.2f %s %s\n", $1-p, $3, $4; p=$1}'
          DYLD_INSERT_LIBRARIES=$PWD/interp.dylib FWE_T=1 target/release/fwe ./bench exit 2>&1 | tail -150
          target/release/fwe --strace ./bench exit 2>&1 | head -40
          for i in 1 2 3; do target/release/fwe ./bench forkexec 50 $PWD/bench; target/release/fwe ./bench getpid 100000; target/release/fwe ./bench fork 100; done
