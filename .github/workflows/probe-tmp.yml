name: probe-tmp
on:
  push:
    branches: [m6-native]
jobs:
  probe:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release -p fwe
      - run: clang -O2 -Wno-deprecated-declarations -o bench-mac guests/c/bench.c
      - name: Build the Linux bench with zig
        run: |
          brew install zig >/dev/null 2>&1 || true
          zig cc -target aarch64-linux-musl -O2 -fPIE -pie -o bench-linux guests/c/bench.c
      - name: Timings
        run: |
          F=target/release/fwe
          time (for i in $(seq 20); do ./bench-mac exit; done)
          time (for i in $(seq 20); do $F --version >/dev/null; done)
          python3 -c "
          import subprocess,time
          for c in [['./bench-mac','exit'],['$F','--version'],['$F','./bench-linux','exit']]:
              ts=[]
              for i in range(20):
                  s=time.perf_counter(); subprocess.run(c,stdout=subprocess.DEVNULL); ts.append((time.perf_counter()-s)*1e3)
              ts.sort(); print(c[-1], 'median %.2f ms min %.2f ms' % (ts[10], ts[0]))
          "
          time (for i in $(seq 20); do $F ./bench-linux exit; done)
          for i in 1 2 3; do FWE_TIMING=1 $F ./bench-linux exit; done
          echo "== fork"
          FWE_TIMING=1 $F ./bench-linux fork 3 2>&1 | tail -20
          echo "== fork+exec"
          FWE_TIMING=1 $F ./bench-linux forkexec 3 ./bench-linux 2>&1 | tail -40
