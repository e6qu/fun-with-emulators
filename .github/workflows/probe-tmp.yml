name: Probe (temporary)
on:
  push:
    branches: [m5-exec]
jobs:
  ltp-state:
    runs-on: macos-26
    strategy:
      matrix:
        c: [main, head]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: Swatinem/rust-cache@v2
      - run: |
          git worktree add -q wt origin/main
          if [ ${{ matrix.c }} = main ]; then (cd wt && CARGO_TARGET_DIR=$PWD/../tgt cargo build -q -p fwe && cp ../tgt/debug/fwe ../fwe-x); else cargo build -q -p fwe && cp target/debug/fwe fwe-x; fi
      - uses: actions/cache@v4
        with:
          path: target/ltp/root
          key: ltp-root-${{ hashFiles('tools/ltp/build.sh') }}
      - run: test -d target/ltp/root/opt/ltp
      - run: sudo sysctl -w kern.maxfiles=184320 kern.maxfilesperproc=92160
      - run: |
          python3 tools/ltp/run.py --fwe $PWD/fwe-x --root target/ltp/root --jobs 4 \
            --only '^(?!fork14$)' --results r.txt > log.txt 2>&1 || true
          tail -3 log.txt
          D=$(getconf DARWIN_USER_TEMP_DIR)fwe-$(id -u)
          for d in "$D"/*; do echo "$(find "$d" 2>/dev/null | wc -l) $d"; done | sort -n | tail -15
          python3 tools/ltp/run.py --fwe $PWD/fwe-x --root target/ltp/root --jobs 1 \
            --only '^fork14$' --results r2.txt > log2.txt 2>&1 || true
          echo "== ${{ matrix.c }}: $(grep -E '^\[[0-9]+/' log2.txt)"
          for d in "$D"/*; do echo "$(find "$d" 2>/dev/null | wc -l) $d"; done | sort -n | tail -5
