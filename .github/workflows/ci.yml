name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo test

  macos:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    # A full run takes about 15 minutes; a hang fails instead of holding the
    # runner for GitHub's six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The Debian and Alpine packages the target-program tests fetch
      # (guests/*/fetch), so each runner downloads them once.
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: sw_vers && uname -m && clang --version
      # The VM backend's tests run on the software stand-in for
      # Hypervisor.framework here, which needs Unicorn.
      - run: brew install unicorn
      - run: cargo build
      - name: Report hypervisor availability (informational)
        run: |
          echo "kern.hv_support:"; sysctl kern.hv_support 2>&1 || true
          # A signed copy: the tests' own fwe stays without the entitlement.
          cp target/debug/fwe target/debug/fwe-hv-probe
          codesign --sign - --entitlements hypervisor.entitlements --force target/debug/fwe-hv-probe || true
          if target/debug/fwe-hv-probe --hv-spike; then
            echo "hypervisor: AVAILABLE on this runner"
          else
            echo "hypervisor: unavailable here (expected on GitHub-hosted runners," \
                 "which are VMs without nested virtualization)"
          fi
      - name: Probe host register behaviour
        run: |
          for p in x18-spin x18-syscall x18-mode x18-mode-write x18-mode-wait x18-mode-spin x18-mode-syscall; do
            printf '%s: ' "$p"; target/debug/fwe --probe "$p" 2>&1 || echo "(exit $?)"
          done
          target/debug/fwe --host-info || echo "(host-info exit $?)"
      - run: cargo test -p fwe-native --test host -- --nocapture
      - name: The VM backend's tests run (on the stand-in), not skip
        run: |
          set +e
          cargo test -p fwe --test guests hv_ -- --nocapture 2>&1 | tee hv-tests.log
          status=${PIPESTATUS[0]}
          if grep -q "skipped:" hv-tests.log; then echo "::error::the VM tests skipped"; exit 1; fi
          exit "$status"
      # The rest: the VM's tests ran in the step above. Images pulled from
      # Docker Hub run here only (FWE_PULL_TESTS), not on a development
      # machine.
      - run: cargo test -- --skip hv_
        env:
          FWE_PULL_TESTS: "1"
      # Why the host killed a process outright (a lock misused in a signal
      # handler, a guard violation), for a guest that died of SIGKILL.
      - if: failure()
        run: |
          /usr/bin/log show --last 60m --style compact --predicate \
            '(eventMessage CONTAINS[c] "unrecoverable" AND NOT eventMessage CONTAINS "CT signature") OR eventMessage CONTAINS[c] "EXC_GUARD" OR (eventMessage CONTAINS "fwe" AND eventMessage CONTAINS[c] "kill")' \
            | tail -200 || true
      # Where fwe itself crashed: the crash reports, but those of a process
      # that killed itself with the guest's fatal signal (one line each),
      # with their faulting thread's registers and frames.
      - if: failure()
        run: |
          python3 - ~/Library/Logs/DiagnosticReports/fwe*.ips <<'PY' || true
          import json, os, sys
          shown = 0
          for f in sorted(sys.argv[1:], key=os.path.getmtime, reverse=True):
              try:
                  r = json.loads(open(f).read().split("\n", 1)[1])
              except (OSError, ValueError, IndexError):
                  continue
              imgs, th = r["usedImages"], r["threads"][r["faultingThread"]]
              frames = [(imgs[fr["imageIndex"]].get("name"), fr.get("symbol"), fr.get("imageOffset", 0))
                        for fr in th["frames"]]
              ex = r.get("exception", {})
              if any(s and "kill_self" in s for _, s, _ in frames):
                  print(f"{f}: {ex.get('signal')}, the guest's (kill_self)")
                  continue
              if shown == 10:
                  continue
              shown += 1
              print(f"=== {f} (parent {r.get('parentProc')} {r.get('parentPid')})")
              print(ex, r.get("termination", {}).get("indicator"))
              print("state", {k: v for k, v in th.get("threadState", {}).items()
                              if k in ("pc", "lr", "sp", "far", "esr", "x")})
              for name, sym, off in frames[:25]:
                  print(name, sym, hex(off))
          PY
      # The whole trace of a container engine's step that failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-traces-${{ matrix.os }}
          path: |
            target/tmp/test-traces
            target/tmp/samples
          if-no-files-found: ignore

  # Alpine's strace and gdb (fetched: guests/alpine/fetch/ptrace.txt)
  # tracing and debugging guest programs. They run here only
  # (FWE_DEBUGGER_TESTS), not on a development machine.
  debuggers:
    name: strace and gdb (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: cargo test -p fwe --test guests -- alpine_strace alpine_gdb --nocapture
        env:
          FWE_DEBUGGER_TESTS: "1"

  # Alpine's Docker Engine (fetched) loading, running and building images.
  # It runs here only (FWE_DOCKER_TESTS), not on a development machine.
  docker:
    name: Docker (macos-26)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: cargo test -p fwe --test guests -- alpine_docker --nocapture
        env:
          FWE_DOCKER_TESTS: "1"
      # Each process's calls and the daemon's log, for a step that failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-traces
          path: |
            target/tmp/docker-traces
            target/tmp/samples

  # Alpine's podman (fetched) building, pushing and pulling images and
  # running rootless. It runs here only (FWE_PODMAN_TESTS), not on a
  # development machine.
  podman:
    name: Podman (macos-26)
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: brew list unicorn >/dev/null 2>&1 || brew install unicorn
      - run: cargo test -p fwe --test guests -- alpine_podman_builds debian_podman_runs_in_the_vm --nocapture
        env:
          FWE_PODMAN_TESTS: "1"
      # Each process's calls and the registry's log, for a step that failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: podman-traces
          path: |
            target/tmp/podman-traces
            target/tmp/samples

  # Alpine's Wine (fetched) running Windows programs built for ARM64, in the
  # VM (on the stand-in here; zig builds the Windows test program). It runs
  # here only (FWE_WINE_TESTS), not on a development machine.
  wine:
    name: Wine (macos-26)
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: brew list unicorn >/dev/null 2>&1 || brew install unicorn
      - run: brew list zig >/dev/null 2>&1 || brew install zig
      - run: cargo test -p fwe --test guests -- alpine_wine --nocapture
        env:
          FWE_WINE_TESTS: "1"
      # The calls of each step that failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wine-traces
          path: |
            target/tmp/wine-traces
            target/tmp/samples

  # Linux's graphical programs on the host's display: X clients of fwe's
  # tests against a headless X server (Homebrew's Xvfb, `XVFB`).
  display:
    name: Display (macos-26)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: brew install xorg-server
      - name: The display tests
        run: |
          export XVFB="$(brew --prefix)/bin/Xvfb"
          cargo test -p fwe --test guests -- display_ --nocapture

  # TEMPORARY (M7 probe, removed before merge): Linux's graphical programs
  # on fwe against a headless X server (Homebrew's Xvfb), natively, and
  # Wine's notepad in the VM; screenshots, outputs and calls kept.
  display-probe:
    name: Display probe ${{ matrix.set }} (macos-26)
    strategy:
      fail-fast: false
      matrix:
        set: [native, wine]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: brew install xorg-server xdpyinfo xwininfo xdotool unicorn
      - name: The probe
        run: |
          export XVFB="$(brew --prefix)/bin/Xvfb"
          export LIBX11="$(brew --prefix libx11)/lib/libX11.6.dylib"
          cargo test -p fwe --test guests -- alpine_display_probe --nocapture
        env:
          FWE_DISPLAY_PROBE: ${{ matrix.set }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: display-probe-${{ matrix.set }}
          path: target/tmp/display-probe

  # Alpine's OpenJDK (fetched) compiling and running a multi-threaded
  # application natively: HotSpot's JIT, threads and garbage collector.
  # It runs here only (FWE_JDK_TESTS), not on a development machine.
  jdk:
    name: JDK (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - name: The JDK
        env:
          FWE_JDK_TESTS: "1"
        run: cargo test -p fwe --test guests -- alpine_jdk --nocapture
      # The calls of each step.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: jdk-traces
          path: target/tmp/jdk-traces

  # The Homebrew formula (Formula/fwe.rb), built from this commit's source
  # in place of a release's, installed and tested as a user would.
  homebrew:
    name: Homebrew formula (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the formula from this commit
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: |
          src="$RUNNER_TEMP/fwe-0.1.0.tar.gz"
          git archive --format=tar.gz --prefix=fwe-0.1.0/ -o "$src" HEAD
          sha=$(shasum -a 256 "$src" | cut -d' ' -f1)
          brew tap-new --no-git local/fwe
          tap=$(brew --repository local/fwe)
          sed -e "s|^  url .*|  url \"file://$src\"|" -e "s|^  sha256 .*|  sha256 \"$sha\"|" \
            Formula/fwe.rb > "$tap/Formula/fwe.rb"
          brew install --build-from-source local/fwe/fwe
          brew test local/fwe/fwe
          codesign -d --entitlements - "$(brew --prefix)/bin/fwe"

  # The benchmarks (tools/bench/run.py): startup, system calls, threads,
  # fork and exec, and Lua's build, natively on arm64 Linux here (Lua in an
  # Alpine container, the GCC fwe's run uses) ...
  bench-linux:
    name: Benchmarks (Linux arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: /tmp/bench-cache
          key: bench-linux-cache-${{ hashFiles('tools/bench/run.py') }}
      - run: gcc -O2 -static-pie -o bench guests/c/bench.c
      - run: python3 tools/bench/run.py linux --bench ./bench --cache /tmp/bench-cache --out linux.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-linux
          path: |
            bench
            linux.json

  # ... then the same program under fwe and its source natively on macOS,
  # and Lua built under fwe with Alpine's GCC: a table of the three in the
  # run's summary.
  bench:
    name: Benchmarks (macos-26)
    needs: bench-linux
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/bench-cache
          key: bench-cache-${{ hashFiles('guests/alpine/fetch/clang.txt', 'guests/alpine/fetch/workloads.txt', 'guests/alpine/fetch/jdk.txt', 'guests/alpine/fetch/nodejs.txt', 'guests/alpine/fetch/luajit.txt', 'tools/bench/run.py') }}
      - uses: actions/download-artifact@v4
        with:
          name: bench-linux
      - run: cargo build --release -p fwe
      - run: clang -O2 -Wno-deprecated-declarations -o bench-mac guests/c/bench.c
      # The native side's programs: the clang release Alpine's root has, and
      # the workloads' programs (tools/bench/run.py, BREW).
      - run: brew install llvm@22 python@3.14 sqlite git xz openjdk@25 node@24 luajit
      - run: chmod +x bench && python3 tools/bench/run.py macos --fwe target/release/fwe --bench ./bench --native ./bench-mac --brew "$(brew --prefix)" --cache target/bench-cache --linux linux.json --out macos.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            macos.json
            bench-*.sample
            bench-*.vmmap
            bench-*.pcs
            bench-*.trace
      - if: failure()
        run: |
          mkdir -p crash-reports
          cp ~/Library/Logs/DiagnosticReports/fwe* crash-reports/ 2>/dev/null || true
          /usr/bin/log show --last 30m --style compact --predicate 'eventMessage CONTAINS[c] "fwe" AND NOT eventMessage CONTAINS "CT signature"' | grep -i -E 'kill|crash|exception|unrecoverable' | tail -40 || true
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-trace
          path: |
            bench-trace.txt
            bench-clang.txt
            crash-reports
          if-no-files-found: ignore

  # The Linux Test Project's system-call tests (tools/ltp): every test of the
  # baseline must still pass, and the pass rate is reported.
  ltp:
    name: LTP system calls (macos-26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The whole root: the tests run in Alpine's root filesystem with LTP
      # in it, and the build that makes both is skipped on a hit.
      - id: ltp-cache
        uses: actions/cache@v4
        with:
          path: target/ltp/root
          key: ltp-root-${{ hashFiles('tools/ltp/build.sh') }}
      - name: Install zig 0.17.0 (to build LTP)
        if: steps.ltp-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          echo "b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a  $RUNNER_TEMP/zig.tar.xz" \
            | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build LTP
        if: steps.ltp-cache.outputs.cache-hit != 'true'
        run: tools/ltp/build.sh target/ltp
      - run: cargo build
      # A process may open as many files as a Linux distribution allows
      # (pipe15 opens 8195), not the runner's 10240, of which fwe keeps a
      # quarter for itself.
      - name: Raise the host's open-file limits
        run: |
          sudo sysctl -w kern.maxfiles=184320 kern.maxfilesperproc=92160
          echo "hard limit: $(ulimit -Hn)"
      - name: Run LTP's system-call tests under fwe
        run: |
          # Four at once: most of a test's time is spent waiting.
          python3 tools/ltp/run.py --fwe target/debug/fwe --root target/ltp/root \
            --jobs 4 --results ltp-results.txt --show
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltp-results
          path: ltp-results.txt
          if-no-files-found: ignore

  # The hypervisor backend, for real. GitHub's hosted macOS runners are VMs
  # without nested virtualization (kern.hv_support = 0), so HVF cannot run
  # there and the hv_ tests skip; this job targets a self-hosted Apple Silicon
  # runner where it can. It stays skipped until the repository variable FWE_HV_SELF_HOSTED
  # is set to "true" (set it once a runner is registered — see
  # docs/hypervisor.md), so it never blocks when no such runner exists.
  hypervisor:
    name: Hypervisor backend (self-hosted Apple Silicon)
    if: ${{ vars.FWE_HV_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      # The flight recorder (docs/hypervisor.md): synchronously to a file
      # that outlives the runner's workspace, and to another machine if the
      # repository variable FWE_HV_RECORD_UDP (udp:HOST:PORT) is set.
      HV_RECORDS: ${{ github.workspace }}/../fwe-hv-records
    steps:
      - uses: actions/checkout@v4
      - name: Report earlier runs that did not finish (a crash)
        run: |
          mkdir -p "$HV_RECORDS"
          echo "booted: $(sysctl -n kern.boottime)"; sw_vers; uptime
          for log in "$HV_RECORDS"/*.log; do
            [ -e "$log" ] || continue
            if ! grep -q " run finished$" "$log"; then
              echo "::warning::$log did not finish; its last records:"
              tail -n 60 "$log"
            fi
          done
          echo "panic reports:"; ls -lt /Library/Logs/DiagnosticReports/ | grep -iE "panic|ResetCounter" | head -10 || true
          # The tests skip while another hypervisor client runs.
          ps -axco comm= | grep -iE "krunkit|vfkit|qemu-system|Virtualization|limactl|UTM|VirtualBoxVM|prl_vm" || echo "no other hypervisor client"
      - run: sysctl kern.hv_support
      - run: brew list unicorn >/dev/null 2>&1 || brew install unicorn
      - run: cargo build --release -p fwe
      - name: Start the flight record
        run: |
          log="$HV_RECORDS/${{ github.run_id }}-${{ github.run_attempt }}.log"
          echo "fwe-hv $(date +%s).000000 run ${{ github.run_id }} of ${{ github.sha }} starts" >> "$log"
          spec="file:$log"
          if [ -n "${{ vars.FWE_HV_RECORD_UDP }}" ]; then spec="$spec,${{ vars.FWE_HV_RECORD_UDP }}"; fi
          echo "FWE_HV_RECORD=$spec" >> "$GITHUB_ENV"
          echo "HV_LOG=$log" >> "$GITHUB_ENV"
      - name: Codesign and run the hypervisor spike
        run: |
          codesign --sign - --entitlements hypervisor.entitlements --force target/release/fwe
          echo "fwe-hv $(date +%s).000000 spike starts" >> "$HV_LOG"
          out="$(target/release/fwe --hv-spike)"
          echo "fwe-hv $(date +%s).000000 spike ends" >> "$HV_LOG"
          echo "$out"
          echo "$out" | grep -qx "hv: hello from the guest"
          echo "$out" | grep -q "guest exited with status 42"
      - name: Compare the stand-in's hv_vm_map rule with the framework's
        run: |
          real="$(target/release/fwe --hv-record "$FWE_HV_RECORD" --probe hv-map-rules)"
          standin="$(env -u FWE_HV_RECORD target/release/fwe --hv-standin --probe hv-map-rules)"
          echo "framework:"; echo "$real"
          if [ "$real" != "$standin" ]; then
            echo "::error::the stand-in's rule differs from the framework's:"
            diff <(echo "$standin") <(echo "$real") || true
            exit 1
          fi
      - name: Run the hypervisor backend's end-to-end tests
        run: |
          set +e
          FWE_HV_TESTS=1 cargo test -p fwe --test guests hv_ -- --nocapture 2>&1 | tee hv-tests.log
          status=${PIPESTATUS[0]}
          # They skip silently where the VM cannot run; here they must not.
          if grep -q "skipped:" hv-tests.log; then echo "::error::the VM tests skipped"; exit 1; fi
          exit "$status"
      - name: Close the flight record
        if: always() && env.HV_LOG != ''
        run: echo "fwe-hv $(date +%s).000000 run ${{ github.run_id }} run finished" >> "$HV_LOG"
      - uses: actions/upload-artifact@v4
        if: always() && env.HV_LOG != ''
        with:
          name: hv-flight-record
          path: ${{ env.HV_LOG }}
