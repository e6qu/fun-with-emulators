name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo test

  macos:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    # A full run takes about 15 minutes; a hang fails instead of holding the
    # runner for GitHub's six hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The Debian and Alpine packages the target-program tests fetch
      # (guests/*/fetch), so each runner downloads them once.
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: sw_vers && uname -m && clang --version
      # The VM backend's tests run on the software stand-in for
      # Hypervisor.framework here, which needs Unicorn.
      - run: brew install unicorn
      - run: cargo build
      - name: Report hypervisor availability (informational)
        run: |
          echo "kern.hv_support:"; sysctl kern.hv_support 2>&1 || true
          # A signed copy: the tests' own fwe stays without the entitlement.
          cp target/debug/fwe target/debug/fwe-hv-probe
          codesign --sign - --entitlements hypervisor.entitlements --force target/debug/fwe-hv-probe || true
          if target/debug/fwe-hv-probe --hv-spike; then
            echo "hypervisor: AVAILABLE on this runner"
          else
            echo "hypervisor: unavailable here (expected on GitHub-hosted runners," \
                 "which are VMs without nested virtualization)"
          fi
      - name: Probe host register behaviour
        run: |
          for p in x18-spin x18-syscall x18-mode x18-mode-write x18-mode-wait x18-mode-spin x18-mode-syscall; do
            printf '%s: ' "$p"; target/debug/fwe --probe "$p" 2>&1 || echo "(exit $?)"
          done
          target/debug/fwe --host-info || echo "(host-info exit $?)"
      - run: cargo test -p fwe-native --test host -- --nocapture
      - name: The VM backend's tests run (on the stand-in), not skip
        run: |
          set +e
          cargo test -p fwe --test guests hv_ -- --nocapture 2>&1 | tee hv-tests.log
          status=${PIPESTATUS[0]}
          if grep -q "skipped:" hv-tests.log; then echo "::error::the VM tests skipped"; exit 1; fi
          exit "$status"
      # The rest: the VM's tests ran in the step above.
      - run: cargo test -- --skip hv_

  # Alpine's strace and gdb (fetched: guests/alpine/fetch/ptrace.txt)
  # tracing and debugging guest programs. They run here only
  # (FWE_DEBUGGER_TESTS), not on a development machine.
  debuggers:
    name: strace and gdb (macos-26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: cargo test -p fwe --test guests -- alpine_strace alpine_gdb --nocapture
        env:
          FWE_DEBUGGER_TESTS: "1"

  # Alpine's Docker Engine (fetched) loading, running and building images.
  # It runs here only (FWE_DOCKER_TESTS), not on a development machine.
  docker:
    name: Docker (macos-26)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: cargo test -p fwe --test guests -- alpine_docker --nocapture
        env:
          FWE_DOCKER_TESTS: "1"
      # Each process's calls and the daemon's log, for a step that failed.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docker-traces
          path: target/tmp/docker-traces

  # TEMPORARY (removed before merging): the crun test, many times, to find
  # a crash seen once.
  crun-stress:
    name: crun stress (macos-26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: target/fetched-packages
          key: fetched-packages-${{ hashFiles('guests/*/fetch/*.txt') }}
      - run: |
          cargo test -p fwe --test guests --no-run
          fails=0
          for i in $(seq 1 30); do
            if ! cargo test -q -p fwe --test guests -- alpine_crun --exact alpine_crun_runs_an_image --nocapture > run-$i.log 2>&1; then
              fails=$((fails+1)); echo "run $i failed"; grep -v "^\[fwe" run-$i.log | tail -40; grep -A20 "last calls" run-$i.log | head -400
            fi
          done
          echo "failed $fails of 30"
          test $fails = 0

  # The Linux Test Project's system-call tests (tools/ltp): every test of the
  # baseline must still pass, and the pass rate is reported.
  ltp:
    name: LTP system calls (macos-26)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The whole root: the tests run in Alpine's root filesystem with LTP
      # in it, and the build that makes both is skipped on a hit.
      - id: ltp-cache
        uses: actions/cache@v4
        with:
          path: target/ltp/root
          key: ltp-root-${{ hashFiles('tools/ltp/build.sh') }}
      - name: Install zig 0.17.0 (to build LTP)
        if: steps.ltp-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/zig.tar.xz" \
            https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          echo "b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a  $RUNNER_TEMP/zig.tar.xz" \
            | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/zig"
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C "$RUNNER_TEMP/zig" --strip-components=1
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
      - name: Build LTP
        if: steps.ltp-cache.outputs.cache-hit != 'true'
        run: tools/ltp/build.sh target/ltp
      - run: cargo build
      # A process may open as many files as a Linux distribution allows
      # (pipe15 opens 8195), not the runner's 10240, of which fwe keeps a
      # quarter for itself.
      - name: Raise the host's open-file limits
        run: |
          sudo sysctl -w kern.maxfiles=184320 kern.maxfilesperproc=92160
          echo "hard limit: $(ulimit -Hn)"
      - name: Run LTP's system-call tests under fwe
        run: |
          # Four at once: most of a test's time is spent waiting.
          python3 tools/ltp/run.py --fwe target/debug/fwe --root target/ltp/root \
            --jobs 4 --results ltp-results.txt --show
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ltp-results
          path: ltp-results.txt
          if-no-files-found: ignore

  # The hypervisor backend, for real. GitHub's hosted macOS runners are VMs
  # without nested virtualization (kern.hv_support = 0), so HVF cannot run
  # there and the hv_ tests skip; this job targets a self-hosted Apple Silicon
  # runner where it can. It stays skipped until the repository variable FWE_HV_SELF_HOSTED
  # is set to "true" (set it once a runner is registered — see
  # docs/hypervisor.md), so it never blocks when no such runner exists.
  hypervisor:
    name: Hypervisor backend (self-hosted Apple Silicon)
    if: ${{ vars.FWE_HV_SELF_HOSTED == 'true' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 60
    env:
      # The flight recorder (docs/hypervisor.md): synchronously to a file
      # that outlives the runner's workspace, and to another machine if the
      # repository variable FWE_HV_RECORD_UDP (udp:HOST:PORT) is set.
      HV_RECORDS: ${{ github.workspace }}/../fwe-hv-records
    steps:
      - uses: actions/checkout@v4
      - name: Report earlier runs that did not finish (a crash)
        run: |
          mkdir -p "$HV_RECORDS"
          echo "booted: $(sysctl -n kern.boottime)"; sw_vers; uptime
          for log in "$HV_RECORDS"/*.log; do
            [ -e "$log" ] || continue
            if ! grep -q " run finished$" "$log"; then
              echo "::warning::$log did not finish; its last records:"
              tail -n 60 "$log"
            fi
          done
          echo "panic reports:"; ls -lt /Library/Logs/DiagnosticReports/ | grep -iE "panic|ResetCounter" | head -10 || true
          # The tests skip while another hypervisor client runs.
          ps -axco comm= | grep -iE "krunkit|vfkit|qemu-system|Virtualization|limactl|UTM|VirtualBoxVM|prl_vm" || echo "no other hypervisor client"
      - run: sysctl kern.hv_support
      - run: brew list unicorn >/dev/null 2>&1 || brew install unicorn
      - run: cargo build --release -p fwe
      - name: Start the flight record
        run: |
          log="$HV_RECORDS/${{ github.run_id }}-${{ github.run_attempt }}.log"
          echo "fwe-hv $(date +%s).000000 run ${{ github.run_id }} of ${{ github.sha }} starts" >> "$log"
          spec="file:$log"
          if [ -n "${{ vars.FWE_HV_RECORD_UDP }}" ]; then spec="$spec,${{ vars.FWE_HV_RECORD_UDP }}"; fi
          echo "FWE_HV_RECORD=$spec" >> "$GITHUB_ENV"
          echo "HV_LOG=$log" >> "$GITHUB_ENV"
      - name: Codesign and run the hypervisor spike
        run: |
          codesign --sign - --entitlements hypervisor.entitlements --force target/release/fwe
          echo "fwe-hv $(date +%s).000000 spike starts" >> "$HV_LOG"
          out="$(target/release/fwe --hv-spike)"
          echo "fwe-hv $(date +%s).000000 spike ends" >> "$HV_LOG"
          echo "$out"
          echo "$out" | grep -qx "hv: hello from the guest"
          echo "$out" | grep -q "guest exited with status 42"
      - name: Compare the stand-in's hv_vm_map rule with the framework's
        run: |
          real="$(target/release/fwe --hv-record "$FWE_HV_RECORD" --probe hv-map-rules)"
          standin="$(env -u FWE_HV_RECORD target/release/fwe --hv-standin --probe hv-map-rules)"
          echo "framework:"; echo "$real"
          if [ "$real" != "$standin" ]; then
            echo "::error::the stand-in's rule differs from the framework's:"
            diff <(echo "$standin") <(echo "$real") || true
            exit 1
          fi
      - name: Run the hypervisor backend's end-to-end tests
        run: |
          set +e
          FWE_HV_TESTS=1 cargo test -p fwe --test guests hv_ -- --nocapture 2>&1 | tee hv-tests.log
          status=${PIPESTATUS[0]}
          # They skip silently where the VM cannot run; here they must not.
          if grep -q "skipped:" hv-tests.log; then echo "::error::the VM tests skipped"; exit 1; fi
          exit "$status"
      - name: Close the flight record
        if: always() && env.HV_LOG != ''
        run: echo "fwe-hv $(date +%s).000000 run ${{ github.run_id }} run finished" >> "$HV_LOG"
      - uses: actions/upload-artifact@v4
        if: always() && env.HV_LOG != ''
        with:
          name: hv-flight-record
          path: ${{ env.HV_LOG }}
