<!doctype html>
<html>
  <!-- The test page drawn by WebGL: a canvas filling the window cleared to
       magenta, "fwe" in green over it. The title names the renderer WebGL
       reports ("fwe-gpu: <renderer>"), which the tests check is the Mac's
       GPU. -->
  <head><meta charset="utf-8"><title>fwe-gpu</title></head>
  <body style="margin:0;background:#000">
    <canvas id="c" style="position:fixed;inset:0;width:100%;height:100%"></canvas>
    <h1 style="position:relative;color:#00ff00;font-size:96px;margin:0">fwe</h1>
    <script>
      const c = document.getElementById("c");
      c.width = innerWidth;
      c.height = innerHeight;
      const opts = { preserveDrawingBuffer: true };
      const gl = c.getContext("webgl2", opts) || c.getContext("webgl", opts);
      if (!gl) {
        document.title = "fwe-gpu: no WebGL";
      } else {
        gl.clearColor(1, 0, 1, 1);
        gl.clear(gl.COLOR_BUFFER_BIT);
        const info = gl.getExtension("WEBGL_debug_renderer_info");
        const r = gl.getParameter(info ? info.UNMASKED_RENDERER_WEBGL : gl.RENDERER);
        document.title = "fwe-gpu: " + r;
        console.log("fwe-gpu: " + r);
      }
    </script>
  </body>
</html>
